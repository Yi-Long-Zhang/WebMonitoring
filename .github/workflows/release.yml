name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  # Required by cosign's keyless signing (the OIDC token is what replaces a
  # long-lived signing key) and by the provenance attestation buildx generates.
  id-token: write
  attestations: write
  # Required to upload the Trivy report as a SARIF result.
  security-events: write

# One release at a time. Releases are rare, so serialising them costs nothing,
# and it is what keeps two tags pushed in quick succession from publishing
# concurrently -- both runs push to the same GHCR repository, so they would race
# on the same package's tags and on its public/private visibility.
#
# cancel-in-progress is false on purpose: cancelling a run that is midway through
# pushing six images would leave a half-published release behind, which is a
# worse state than waiting for the queued one.
concurrency:
  group: release
  cancel-in-progress: false

# Every action below is pinned to a commit SHA rather than a movable tag: a tag
# is a pointer its owner can repoint at any commit, and these steps hold the
# release and the scan credentials. The trailing comment names the version that
# SHA is, and dependabot reads that comment, so it still proposes updates --
# a new SHA instead of a new tag. It is the same rule the repository already
# applies to the object-store image, which ADR 0007 pins by digest.
#
# It pins the actions this workflow names, and only those. What an action names
# in turn is whatever its own pinned commit says -- so a pinned action can still
# point at a movable tag, or at one that has since been deleted. The Trivy step
# below is a case where exactly that happened.
jobs:
  images:
    runs-on: ubuntu-latest
    # The same hang guard the two drill jobs in ci.yml carry. Nothing else bounds
    # this job: it builds six images (the browser-worker sits on a 3.55 GB
    # Playwright base), signs each one and scans each one with Trivy. A stuck
    # pull or a wedged scan would otherwise sit on the 360-minute default. 60 is
    # a hang guard, not a budget: it is deliberately far above the expected
    # runtime so it cannot turn a slow runner into a false failure.
    #
    # Unlike the CI jobs this one had never run when 60 was written, so it was an
    # estimate carried over from the comparable jobs. The first real run
    # (38350038510) measured it: the slowest job, browser-worker, took 3m41s
    # end to end, and the fastest 1m47s. 60 therefore stands as a hang guard with
    # a wide margin rather than a tight budget -- which is what it is for.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app:
          # `binary` names the images whose Dockerfile stamps a build identity
          # into the executable (ARG VERSION/COMMIT/BUILD_TIME plus -ldflags -X
          # webmonitoring/internal/version.*) and where that executable lands.
          # apps/console/Dockerfile declares only CONSOLE_SOURCEMAP and
          # apps/browser-worker/Dockerfile declares no ARG at all, so stamping
          # those would log "unused build arg" and do nothing else.
          - { name: api, dockerfile: apps/api/Dockerfile, binary: /app/webmonitoring-api }
          - { name: http-worker, dockerfile: apps/http-worker/Dockerfile, binary: /app/webmonitoring-worker }
          - { name: browser-worker, dockerfile: apps/browser-worker/Dockerfile }
          - { name: console, dockerfile: apps/console/Dockerfile }
          - { name: migrate, dockerfile: apps/migrate/Dockerfile, binary: /app/webmonitoring-migrate }
          # rewrap runs from `docker compose run --rm rewrap` in the operations
          # manual, so its image has to be published alongside the rest.
          - { name: rewrap, dockerfile: apps/rewrap/Dockerfile, binary: /app/webmonitoring-rewrap }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One image name, resolved once. Docker refuses an uppercase repository
      # name outright -- `docker create ghcr.io/Yi-Long-Zhang/WebMonitoring/api@…`
      # answers "invalid reference format: repository name … must be lowercase"
      # -- and this repository's owner is mixed case. GitHub expressions have no
      # lowercase function, so it happens in bash (${VAR,,}).
      #
      # The same step resolves the build identity, because both belong to "the
      # one name for this release". A local `docker compose build` leaves the
      # identity at its defaults ("dev", "unknown") and that is honest; a release
      # is the one build where it is known. BUILD_TIME is the *commit's* time,
      # not `date`: six parallel jobs calling date would stamp six different
      # build times onto one release. VERSION is the tag verbatim, which is what
      # `make release-check` (git describe --tags --exact-match) prints as well.
      #
      # console and browser-worker have no `binary`: their Dockerfiles declare no
      # VERSION/COMMIT/BUILD_TIME ARG, so passing them would only log "unused
      # build arg" six times over. They still get an image name.
      - name: Resolve the image name and the build identity
        id: identity
        env:
          BINARY: ${{ matrix.app.binary }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app.name }}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Where this job pushes first, before any release tag exists. The scan
          # below runs against it, and only a passing scan promotes that digest
          # onto the release tags. `sha-<7>` is a tag metadata-action emits
          # anyway, so gating here costs no tag of its own.
          echo "stage=$image:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ -z "$BINARY" ]; then
            exit 0
          fi
          build_time="$(git show -s --format=%cI "$GITHUB_SHA")"
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "build_time=${build_time}"
            echo "args<<BUILD_ARGS"
            echo "VERSION=${GITHUB_REF_NAME}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "BUILD_TIME=${build_time}"
            echo "BUILD_ARGS"
          } >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.identity.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          push: true
          # Deliberately not `steps.meta.outputs.tags`: the release tags are
          # created later, by the promote step, and only once the scan has
          # passed. See that step for why the digest survives the move.
          tags: ${{ steps.identity.outputs.stage }}
          labels: ${{ steps.meta.outputs.labels }}
          # Empty for the two images that take no stamp.
          build-args: ${{ steps.identity.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit writes an SPDX SBOM and SLSA provenance as registry
          # attestations next to the image digest. No extra tooling, and it
          # records what went in rather than only what came out.
          provenance: mode=max
          sbom: true
      # The stamp is only real if it reached the published binary. Nothing else
      # would notice if it did not: the image would log and serve "dev" and every
      # job would stay green -- which is how this gap survived until it was found
      # by reading the workflow (docs/rehearsals.md, item 1.5).
      #
      # Read out of the binary rather than asked of the running image: the images
      # are distroless (no shell), the api needs a database to answer
      # /api/v1/version, and `go version -m` does **not** record -ldflags, so the
      # injected strings are the only reliable reading. The commit SHA is the
      # strong one: -X is the only way it can reach these bytes, because
      # .dockerignore excludes .git and the build therefore has no VCS stamping.
      - name: The published binary must carry this release's identity
        if: matrix.app.binary
        run: |
          image="${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}"
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null' EXIT
          docker cp "$container:${{ matrix.app.binary }}" ./published-binary
          status=0
          for want in \
            "${{ steps.identity.outputs.version }}" \
            "${{ steps.identity.outputs.commit }}" \
            "${{ steps.identity.outputs.build_time }}"
          do
            if grep -qaF -- "$want" ./published-binary; then
              echo "found in the published binary: $want"
            else
              echo "the published binary does not carry '$want'" >&2
              status=1
            fi
          done
          exit "$status"
      # The scan runs here, before anything is published under a release tag. The
      # build above pushed only `<image>:sha-<7>`, so this is looking at the exact
      # bytes the release would ship, and a failure means no release tag is ever
      # created for this image -- which is the difference between a gate and a
      # notification. It used to run after the push and after the signature, and
      # that ordering is why the first real release (run 38350038510) published
      # six images and then reported itself red: `exit-code: '1'` could only ever
      # describe what had already been shipped.
      #
      # Scans the image rather than the build context, so base-image packages are
      # covered too. ignore-unfixed keeps the gate actionable: the bases are
      # golang, node, nginx, distroless and the Playwright image, and an unfixed
      # base CVE would otherwise block every release forever.
      - name: Scan for vulnerabilities
        # Two separate defects lived on this one line, both invisible until the
        # workflow ran for the first time:
        #
        # 1. It said `@0.28.0`, which is not a ref this action has (every tag is
        #    spelled `v0.x.y`).
        # 2. Fixing that to the SHA of `v0.28.0` was not enough, because v0.28.0
        #    is itself unusable: its action.yaml line 111 is
        #    `uses: aquasecurity/setup-trivy@v0.2.1`, and setup-trivy has no such
        #    tag (it has v0.3.1, v0.3.0, v0.2.6). GitHub resolves nested actions
        #    while setting the job up, so every matrix job died in "Set up job"
        #    before a single step ran -- run 38347578201. v0.30.0 is broken the
        #    same way (`setup-trivy@v0.2.2`); v0.32.0 is the first release that
        #    pins its nested dependencies to SHAs instead of tags.
        #
        # So pinning the outer action is not by itself enough: it freezes the
        # recipe, and the recipe can still name a tag that moves or disappears.
        # v0.36.0 pins both of its nested uses to commits that exist, which is
        # what makes this one safe. (dependabot's open PR already proposes this
        # same bump.)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.identity.outputs.stage }}
          format: sarif
          output: trivy-${{ matrix.app.name }}.sarif
          # `severity` does nothing on its own here. With `format: sarif` the
          # action unsets TRIVY_SEVERITY unless `limit-severities-for-sarif` is
          # true -- entrypoint.sh in the pinned commit, the `unset TRIVY_SEVERITY`
          # under "Building SARIF report with all severities". The whole step is a
          # single `trivy` invocation, so the unset also decides the exit code:
          # without this line the gate runs on every severity, UNKNOWN included.
          # That is how run 38350038510 failed all four Go images on one
          # UNKNOWN-severity tzdata advisory (DLA-4792-1) that CRITICAL,HIGH
          # ignores -- the same published api image exits 1 without this line and
          # 0 with it.
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload the scan report
        # always(): the step above fails the job on a finding, and the report is
        # most useful precisely when that happens.
        if: always()
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          sarif_file: trivy-${{ matrix.app.name }}.sarif
          # Without this, the six jobs collapse into one report. The action works
          # out its code-scanning category from its `matrix` input, which defaults
          # to `toJson(matrix)`; codeql-action then folds only *string* matrix
          # values into that category and degrades every object value to an empty
          # segment (`src/api-client.ts`, computeAutomationID) -- and this matrix's
          # entries are objects, so all six jobs compute the same category and each
          # upload replaces the one before it. Nothing goes red either way, which
          # is what makes it silent: six images scanned, one image's findings on
          # file. Naming the image keeps them apart.
          category: ${{ matrix.app.name }}
      # Keyless: the workflow's OIDC identity is the signer, so there is no key
      # material in secrets to leak or rotate. Verify with
      #   cosign verify ghcr.io/<repo>/<app>@<digest> \
      #     --certificate-identity-regexp '^https://github.com/<repo>/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #
      # Signing comes after the scan but before the promotion, so the release
      # tags never point at an image that is not yet signed.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - name: Sign the scanned image
        run: cosign sign --yes ${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}
      # Only here, at the end of a green run, do the release tags come into
      # existence. `imagetools create` copies the index -- the amd64 manifest
      # *and* the SBOM/provenance attestation manifest next to it -- so every
      # release tag resolves to the identical digest that was scanned and signed
      # above, not to a rebuild that merely looks the same. That was measured
      # against a local registry before this was written: promoting a two-entry
      # index left both entries in place and the index digest unchanged.
      #
      # Every tag metadata-action produced is created, `latest` included. That
      # one is the action's own `flavor.latest=auto` default rather than anything
      # this file asks for -- it was published by the first real release without
      # appearing in this file at all. Listing it here would change the release's
      # tag set, and that is a decision this change is not entitled to make; the
      # open question is recorded in docs/rehearsals.md instead.
      - name: Promote the scanned digest to the release tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ steps.identity.outputs.stage }}
        run: |
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              args+=(-t "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"
