name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webmonitoring
          POSTGRES_USER: webmonitoring
          POSTGRES_PASSWORD: webmonitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmonitoring -d webmonitoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Configure integration test services
        run: |
          echo "POSTGRES_TEST_DSN=postgres://webmonitoring:webmonitoring@localhost:5432/webmonitoring?sslmode=disable" >> "$GITHUB_ENV"
          echo "REDIS_TEST_ADDR=localhost:6379" >> "$GITHUB_ENV"
      - run: git ls-files '*.go' -z | xargs -0 gofmt -l | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt
      - run: go vet ./...
      # -race 是这一层最值钱的部分：多副本的不变量与事件广播都只在并发下暴露，
      # 而此前全仓库没有任何地方启用过它（唯一那条并发测试因此零断言地躺着）。
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      # 锁到具体版本而不是 latest，否则上游发布新 linter 会凭空让历史提交变红；
      # 用 go install 而不是官方 action，是为了版本与 go.mod 一样显式，且不必再猜
      # action 的大版本与 linter 大版本是否配套。
      #
      # 从 v1.64.8 换到 v2 不是「想升级」：v1.64.8 内置的类型检查器读不懂 go1.27
      # 的导出数据（`cannot decode "cmp", export data version 5 ...`），会以
      # Running error 退出码 3 收场——也就是说这个门禁此前什么都没检查过。
      # v2 的配置格式不同，.golangci.yml 已随之迁移。
      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run
      # 覆盖率只做「报告 + 棘轮」：打印真实数字，低于下限就失败，不设 KPI 阈值。
      # 下限按实测留了余量（带服务容器时约 60%），目的是不让它无声下跌，而不是
      # 考核数字本身。
      - name: Coverage floor
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          awk -v t="$total" -v floor=55 'BEGIN { if (t+0 < floor) { printf "total coverage %s%% is below the floor %d%%\n", t, floor; exit 1 } }'
      # 漏洞扫描。锁版本而非 latest，理由同 golangci-lint。阻断式：本步骤引入时
      # 报出 GO-2026-5004（pgx/v5 占位符混淆 SQL 注入），随后的安全提交把
      # pgx 升到 v5.11.0 并实测归零（govulncheck 退出码 0），因此不再需要
      # continue-on-error。
      #
      # 注意这不是一次性的：漏洞库每天更新，标准库的修复按「补丁版本」发布。
      # 本步骤随后又因 1.27.1 的 11 个可达漏洞（含 html/template 的两个上下文
      # 转义错判）再次变红，靠 go.mod 的 `toolchain go1.27.2` 与 x/net v0.60.0
      # 修复。新增漏洞时先看这里，再决定是升依赖还是升工具链。
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webmonitoring/console generate:api
      # The committed types are generated from api/openapi.yaml and the console
      # is compiled against them, so a contract change that was not regenerated
      # makes the two disagree silently. This turns that into a failed build.
      # It is the check that would have caught the Incident fields that were
      # serialized by the handler but missing from the contract until they were
      # found by hand.
      - name: Generated API types must match the contract
        run: git diff --exit-code apps/console/src/types/generated/api.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, node]
    env:
      SMOKE_PROJECT_NAME: webmonitoring-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webmonitoring/console exec playwright install --with-deps chromium
      - name: Run Compose smoke test
        shell: pwsh
        run: ./scripts/compose-smoke.ps1

  # 多副本演练是唯一能测出"横向扩容会静默重复执行检测"的检查：迁移 000012 的
  # 部分唯一索引 detection_jobs_active_uidx 是它的被测对象，compose-smoke 走的是
  # API 逐资产建任务那条与调度器无关的路径，覆盖不到。默认参数即最小的真实拓扑
  # （2 个 api 副本 + 3 个 http-worker），40 资产、240 秒上限。
  multi-replica-drill:
    runs-on: ubuntu-latest
    needs: [backend, node]
    env:
      MRDRILL_PROJECT_NAME: webmonitoring-drill-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run multi-replica drill
        shell: pwsh
        run: ./scripts/multi-replica-drill.ps1
