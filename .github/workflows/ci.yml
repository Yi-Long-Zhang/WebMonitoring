name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webmonitoring
          POSTGRES_USER: webmonitoring
          POSTGRES_PASSWORD: webmonitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webmonitoring -d webmonitoring"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Configure integration test services
        run: |
          echo "MUTATION: deliberately not passing the DSNs down"
      - run: git ls-files '*.go' -z | xargs -0 gofmt -l | tee /tmp/gofmt.txt && test ! -s /tmp/gofmt.txt
      - run: go vet ./...
      # -race 是这一层最值钱的部分：多副本的不变量与事件广播都只在并发下暴露，
      # 而此前全仓库没有任何地方启用过它（唯一那条并发测试因此零断言地躺着）。
      - run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
        # 声明本次运行必须有集成服务：置此变量后，缺 DSN 的集成用例是 t.Fatal
        # 而不是 t.Skip（internal/store/lease_test.go 等六处）。没有它，一个没能
        # 把 DSN 传下去的运行器会跳过全部集成用例然后退出 0，看起来是绿的——那正是
        # 门禁最不能有的结果，也是本地 scripts/integration-test.ps1 一直在防的那件事。
        #
        # 刻意挂在这一步，而不是上面那个 Configure 步骤：挂在配置步骤里，一旦那个
        # 步骤本身被改坏（变量改名、整步删掉），保险会和它要保护的东西一起消失，
        # 等于没装。挂在这里，DSN 断掉就是红的。
        env:
          WEBMONITORING_TEST_REQUIRE_SERVICES: "1"
      # 锁到具体版本而不是 latest，否则上游发布新 linter 会凭空让历史提交变红；
      # 用 go install 而不是官方 action，是为了版本与 go.mod 一样显式，且不必再猜
      # action 的大版本与 linter 大版本是否配套。
      #
      # 从 v1.64.8 换到 v2 不是「想升级」：v1.64.8 内置的类型检查器读不懂 go1.27
      # 的导出数据（`cannot decode "cmp", export data version 5 ...`），会以
      # Running error 退出码 3 收场——也就是说这个门禁此前什么都没检查过。
      # v2 的配置格式不同，.golangci.yml 已随之迁移。
      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          golangci-lint run
      # 覆盖率只做「报告 + 棘轮」：打印真实数字，低于下限就失败，不设 KPI 阈值。
      # 下限按实测留了余量（带服务容器时约 60%），目的是不让它无声下跌，而不是
      # 考核数字本身。
      - name: Coverage floor
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          awk -v t="$total" -v floor=55 'BEGIN { if (t+0 < floor) { printf "total coverage %s%% is below the floor %d%%\n", t, floor; exit 1 } }'
      # 漏洞扫描。锁版本而非 latest，理由同 golangci-lint。阻断式：本步骤引入时
      # 报出 GO-2026-5004（pgx/v5 占位符混淆 SQL 注入），随后的安全提交把
      # pgx 升到 v5.11.0 并实测归零（govulncheck 退出码 0），因此不再需要
      # continue-on-error。
      #
      # 注意这不是一次性的：漏洞库每天更新，标准库的修复按「补丁版本」发布。
      # 本步骤随后又因 1.27.1 的 11 个可达漏洞（含 html/template 的两个上下文
      # 转义错判）再次变红，靠 go.mod 的 `toolchain go1.27.2` 与 x/net v0.60.0
      # 修复。新增漏洞时先看这里，再决定是升依赖还是升工具链。
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webmonitoring/console generate:api
      # The committed types are generated from api/openapi.yaml and the console
      # is compiled against them, so a contract change that was not regenerated
      # makes the two disagree silently. This turns that into a failed build.
      # It is the check that would have caught the Incident fields that were
      # serialized by the handler but missing from the contract until they were
      # found by hand.
      - name: Generated API types must match the contract
        run: git diff --exit-code apps/console/src/types/generated/api.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      # Four tests in apps/browser-worker/test drive a real Chromium
      # (login.test.ts x3, security.test.ts x1). This job installed the
      # `playwright` npm package but never downloaded the browser, so those
      # four failed with `browserType.launch: Executable doesn't exist` --
      # from 2026-09-13 until it was noticed, which also held compose-smoke
      # and multi-replica-drill behind `needs: [backend, node]`. They had
      # never run once.
      #
      # Deliberately placed after lint/typecheck: those are cheap and should
      # fail fast rather than behind a browser download. The browser comes
      # from the package's own version so it cannot drift from the lockfile
      # (the browser-worker image tag v1.63.0-noble has to match it too).
      - name: Install the browser the worker tests drive
        run: pnpm --filter @webmonitoring/browser-worker exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, node]
    # These two jobs build six images -- the browser-worker sits on a 3.55 GB
    # Playwright base -- and then wait on service health. Nothing else bounds
    # them, so without this a stuck pull or a wedged container sits on the
    # 360-minute default. 60 is a hang guard, not a budget: it is deliberately
    # far above the expected runtime so it cannot turn a slow runner into a
    # false failure.
    timeout-minutes: 60
    env:
      SMOKE_PROJECT_NAME: webmonitoring-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @webmonitoring/console exec playwright install --with-deps chromium
      - name: Run Compose smoke test
        shell: pwsh
        run: ./scripts/compose-smoke.ps1

  # 多副本演练是唯一能测出"横向扩容会静默重复执行检测"的检查：迁移 000012 的
  # 部分唯一索引 detection_jobs_active_uidx 是它的被测对象，compose-smoke 走的是
  # API 逐资产建任务那条与调度器无关的路径，覆盖不到。默认参数即最小的真实拓扑
  # （2 个 api 副本 + 3 个 http-worker），40 资产、240 秒上限。
  multi-replica-drill:
    runs-on: ubuntu-latest
    needs: [backend, node]
    # Same hang guard as compose-smoke. The drill's own -TimeoutSeconds (900)
    # bounds only its polling loop; image builds, pulls and the health waits
    # all sit outside it.
    timeout-minutes: 60
    env:
      MRDRILL_PROJECT_NAME: webmonitoring-drill-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Run multi-replica drill
        shell: pwsh
        run: ./scripts/multi-replica-drill.ps1
