services:
  postgres:
    volumes:
      - ${SMOKE_DATA_ROOT}/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - ${SMOKE_DATA_ROOT}/redis:/data

  minio:
    ports: !reset []
    volumes:
      - ${SMOKE_DATA_ROOT}/minio:/data

  smoke-target:
    image: nginx:1.29-alpine
    volumes:
      - ${SMOKE_DATA_ROOT}/target:/usr/share/nginx/html:ro
      # The default conf is replaced so a second, cookie-gated server block can
      # live on its own hostname. Gating "/" instead would make every
      # unauthenticated check see a login page, so the content-tamper assertions
      # below would pass for the wrong reason.
      - ${SMOKE_DATA_ROOT}/smoke-target.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
        aliases:
          # Listed explicitly rather than relying on the implicit service-name
          # alias, because the whole script depends on http://smoke-target/.
          - smoke-target
          - smoke-login
    healthcheck:
      # 127.0.0.1, not localhost: with a mounted conf the nginx entrypoint cannot
      # add the IPv6 listen, so only IPv4 is bound and localhost may resolve to
      # ::1. The load test documents the same trap.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    ports: !override
      - "18080:8080"
    environment:
      ALLOW_PRIVATE_TARGETS: "true"
      # Set here rather than left to the base file, which now requires the
      # variable outright (":?") because the script exports it only later, for the
      # console walk. The smoke stack is torn down at the end of the run, so the
      # value needs no secrecy; it is deliberately not the repository's published
      # development default, which the production gate refuses.
      ADMIN_PASSWORD: "smoke-test-admin-password"
      # The smoke drives the whole API from one tenant in a couple of minutes:
      # it registers assets, queues and cancels jobs, and runs the console walk.
      # That is far past the production quotas (600/120/12 per minute), and the
      # limiter was added after this script, so the bulk class started answering
      # 429 RATE_LIMITED partway through and the whole run failed. The quotas are
      # about bounding a real tenant's blast radius, which has no meaning for a
      # throwaway stack that is torn down at the end of the run, so raise them
      # here rather than teaching the script to pace itself around a limit it
      # exists to exercise elsewhere.
      RATE_LIMIT_READ_PER_WINDOW: "100000"
      RATE_LIMIT_WRITE_PER_WINDOW: "20000"
      RATE_LIMIT_BULK_PER_WINDOW: "2000"

  http-worker:
    environment:
      ALLOW_PRIVATE_TARGETS: "true"

  console:
    ports: !override
      - "18088:8080"
