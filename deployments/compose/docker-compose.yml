# Every service caps its logs. Without this a stack that runs for months fills
# the host disk with container logs, and the failure lands on whichever service
# writes most rather than on the one that is unhealthy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Connection pool bounds. These are forwarded rather than defaulted here: the
# numbers live in internal/store/pool.go, and repeating them in this manifest
# would give a deployment a second, silently stale source of truth. Unset is
# forwarded as unset, so the code default applies -- which is also what the
# production gate expects, since it refuses a pool bound that is present and
# unusable rather than an absent one.
#
# The API and the http-worker keep a pool for their lifetime and the rewrap
# tool opens one per run, so all three read these. The migration runner builds
# its own one-shot pool and is deliberately not covered: it exits with the run,
# so there is no long-lived occupancy to bound.
x-postgres-pool-env: &postgres-pool-env
  POSTGRES_MAX_CONNS: ${POSTGRES_MAX_CONNS:-}
  POSTGRES_MIN_CONNS: ${POSTGRES_MIN_CONNS:-}
  POSTGRES_MAX_CONN_LIFETIME_SECONDS: ${POSTGRES_MAX_CONN_LIFETIME_SECONDS:-}
  POSTGRES_MAX_CONN_IDLE_SECONDS: ${POSTGRES_MAX_CONN_IDLE_SECONDS:-}
  POSTGRES_HEALTH_CHECK_SECONDS: ${POSTGRES_HEALTH_CHECK_SECONDS:-}
  POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-}

# Detection and alert queue retry parameters, and the per-channel alert limiter
# and circuit breaker. The API and the http-worker both read all eight: the
# queue knobs are applied where each service builds its consumer, and the gate
# policy is parsed at startup. .env.example advertises them and the production
# gate refuses a 0 for the alert controls -- but until they are forwarded here,
# in the only deployment this repository supports, the operator's value never
# reached the process the gate inspects.
x-queue-alert-env: &queue-alert-env
  QUEUE_MAX_DELIVERIES: ${QUEUE_MAX_DELIVERIES:-}
  QUEUE_MIN_IDLE_SECONDS: ${QUEUE_MIN_IDLE_SECONDS:-}
  ALERT_QUEUE_MAX_DELIVERIES: ${ALERT_QUEUE_MAX_DELIVERIES:-}
  ALERT_QUEUE_MIN_IDLE_SECONDS: ${ALERT_QUEUE_MIN_IDLE_SECONDS:-}
  ALERT_GATE_WINDOW_SECONDS: ${ALERT_GATE_WINDOW_SECONDS:-}
  ALERT_MAX_PER_CHANNEL_PER_WINDOW: ${ALERT_MAX_PER_CHANNEL_PER_WINDOW:-}
  ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD:-}
  ALERT_CIRCUIT_COOLDOWN_SECONDS: ${ALERT_CIRCUIT_COOLDOWN_SECONDS:-}

services:
  postgres:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 30s
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webmonitoring
      POSTGRES_USER: webmonitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or copy .env.example into deployments/compose/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Postgres uses shared memory for parallel queries and sorting; the 64 MB
    # container default is a real bottleneck under load.
    shm_size: 512mb
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmonitoring"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 30s
    image: redis:8-alpine
    # Setting REDIS_PASSWORD turns on requirepass. The application must then
    # carry the same password in REDIS_ADDR (redis://:password@redis:6379);
    # a mismatch fails closed at startup rather than degrading silently.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      # REDISCLI_AUTH rather than -a: -a puts the password in the process
      # arguments, where anything that can read /proc can see it. The conditional
      # keeps the password-less development stack working -- redis-cli with an
      # empty REDISCLI_AUTH would still send AUTH and be rejected.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] && redis-cli ping || REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    build:
      context: ../..
      dockerfile: apps/migrate/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        # The release identity api carries (see the api service). Without the
        # forwarding, one `docker compose build` produced images that disagreed
        # about which release they came from.
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        GOPROXY: ${GOPROXY:-}
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or copy .env.example into deployments/compose/.env}@postgres:5432/webmonitoring?sslmode=${POSTGRES_SSLMODE:-disable}
      # Set to 1 for an upgrade window whose pending migrations are marked
      # destructive ("-- migrate:destructive"). Fresh installs never need it:
      # bootstrapping an empty database is allowed unattended. Leave unset
      # otherwise so a destructive upgrade fails closed instead of applying
      # unreviewed data-mutating SQL.
      MIGRATE_CONFIRM_DESTRUCTIVE: ${MIGRATE_CONFIRM_DESTRUCTIVE:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *default-logging

  # S3-compatible object store. VersityGW (Apache-2.0) with its posix backend
  # keeps evidence in the volume as ordinary files. It replaced MinIO, whose
  # published images were withdrawn; see docs/adr/0007 for the evaluation.
  objectstore:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 30s
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    # Omitting --iam-dir puts VersityGW in single-account mode, where the
    # credentials come from ROOT_ACCESS_KEY/ROOT_SECRET_KEY instead of a user
    # database. That is the shape this stack wants -- one credential pair, which
    # is already what S3_ACCESS_KEY/S3_SECRET_KEY carry -- and it keeps the .env
    # contract unchanged. Region is pinned rather than defaulted so the value the
    # server signs with is visible here.
    command: ["--port", ":9000", "--region", "us-east-1", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY, or copy .env.example into deployments/compose/.env}
      ROOT_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY, or copy .env.example into deployments/compose/.env}
    volumes:
      - objectstore-data:/data
    # No published ports. Everything that talks to the object store -- the API,
    # the workers and the rclone client used by the backup rehearsal -- runs
    # inside the Compose network, so exposing it to the host served no purpose.
    # The three drill overlays already reset these ports; this makes the base
    # file agree with them.
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    logging: *default-logging
    # VersityGW serves no dedicated health endpoint: an unauthenticated GET /
    # answers 403, and a complete status line is proof the listener is serving.
    # Two details are deliberate. `curl` is absent from this image (Alpine +
    # busybox), so the request is written by hand over nc; and an HTTP reply is
    # required rather than a bare `nc -z`, which would also pass for a socket
    # that accepts connections but never answers. 5xx is rejected, so this is no
    # weaker than the `curl -f` check it replaces.
    # The single quotes around the test keep \r\n literal for printf; in a
    # double-quoted YAML scalar they would become a real CR and LF and printf
    # would never emit a complete request line.
    healthcheck:
      test: ["CMD-SHELL", 'printf "GET / HTTP/1.0\r\n\r\n" | nc -w 2 127.0.0.1 9000 | head -n1 | grep -qE "HTTP/1\.[01] [234]"']
      interval: 5s
      timeout: 3s
      retries: 20

  # rclone serves the backup/restore rehearsal's object-store client. It lives
  # behind a profile so `up` never starts it, and it runs inside the Compose
  # network so the scripts need neither a host rclone install nor a published
  # object-store port.
  rclone:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    profiles: ["tools"]
    depends_on:
      objectstore: { condition: service_healthy }

  # Key-rotation pass. Behind a profile so `up` never starts it, and given the
  # same key material and DSN the API uses so it re-seals under exactly the key
  # the API writes with. Run it as:
  #   docker compose run --rm rewrap --dry-run
  #   docker compose run --rm rewrap
  # It takes an advisory lease, so a run overlapping a second one exits without
  # doing anything rather than re-sealing rows the other just sealed.
  rewrap:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    build:
      context: ../..
      dockerfile: apps/rewrap/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        # The release identity api carries (see the api service). This one runs
        # on customer data from the operations manual, so it is the worst image
        # to leave unable to say which release it is.
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        GOPROXY: ${GOPROXY:-}
    profiles: ["tools"]
    environment:
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or copy .env.example into deployments/compose/.env}@postgres:5432/webmonitoring?sslmode=${POSTGRES_SSLMODE:-disable}
      <<: *postgres-pool-env
      ALERT_SECRET_KEYS: ${ALERT_SECRET_KEYS:-}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *default-logging

  browser-worker:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 75s
    build:
      context: ../..
      dockerfile: apps/browser-worker/Dockerfile
      network: ${BUILD_NETWORK:-default}
    environment:
      PORT: "8081"
      WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN, or copy .env.example into deployments/compose/.env}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    # Every BROWSER-mode check calls this worker synchronously, so a crashed
    # worker makes those checks fail until someone restarts it by hand.
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 30s
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      # Stamped into the binary the version endpoint reports. Unset is honest:
      # the image then says "dev", not a version it is not.
      args:
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        # Build-time only. Empty leaves the toolchain's own proxy; a builder on a
        # network that blocks proxy.golang.org sets GOPROXY in .env, e.g.
        # https://goproxy.cn,direct -- the same class of workaround as BUILD_NETWORK.
        GOPROXY: ${GOPROXY:-}
      network: ${BUILD_NETWORK:-default}
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD, or copy deployments/compose/.env.default into .env}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # Gates /metrics (Authorization: Bearer). Empty keeps it open, which the
      # production gate refuses; set it before exposing the API port.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # The unclaimed-incident escalation sweep. Only the control plane runs it.
      # Set the interval to 0 to disable the timer; the manual trigger still works.
      ESCALATION_INTERVAL_MINUTES: ${ESCALATION_INTERVAL_MINUTES:-5}
      ESCALATION_UNCLAIMED_MINUTES: ${ESCALATION_UNCLAIMED_MINUTES:-30}
      # Only the API serves browser traffic, so only the API reads this. Empty
      # means same-origin, which is the single-host topology's default.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN, or copy .env.example into deployments/compose/.env}
      # Versioned rotation form. When ALERT_SECRET_KEYS is set it takes precedence
      # over the singular variable, so a rotation is a change to this one line.
      ALERT_SECRET_KEYS: ${ALERT_SECRET_KEYS:-}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
      QUEUE_RETRY_BASE_MILLISECONDS: ${QUEUE_RETRY_BASE_MILLISECONDS:-500}
      ALERT_MAX_ATTEMPTS: ${ALERT_MAX_ATTEMPTS:-3}
      ALERT_RETRY_BASE_MILLISECONDS: ${ALERT_RETRY_BASE_MILLISECONDS:-250}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # How long a RUNNING detection claim is honoured. Must exceed one second
      # of the policy timeout: the cap is 90s and a BROWSER check spends it
      # twice, so the production gate rejects anything at or below 270. The
      # default here is well clear of that.
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-600}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Terminal detection jobs are swept once per RETENTION_INTERVAL_HOURS
      # once older than this. QUEUED/RUNNING rows are never touched.
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      # Empty endpoint keeps tracing off; set it to an OTLP/HTTP collector to enable.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or copy .env.example into deployments/compose/.env}@postgres:5432/webmonitoring?sslmode=${POSTGRES_SSLMODE:-disable}
      <<: [*postgres-pool-env, *queue-alert-env]
      # Set REDIS_ADDR to redis://:password@redis:6379 when REDIS_PASSWORD is set.
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY, or copy .env.example into deployments/compose/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY, or copy .env.example into deployments/compose/.env}
      S3_BUCKET: evidence
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      browser-worker: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "8080:8080"
    mem_limit: 1g
    cpus: 2
    # read_only is deliberately not set: the API writes DATA_DIR.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  http-worker:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 75s
    build:
      context: ../..
      dockerfile: apps/http-worker/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        # The release identity api carries (see the api service). Without the
        # forwarding, one `docker compose build` produced images that disagreed
        # about which release they came from.
        VERSION: ${APP_VERSION:-dev}
        COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${APP_BUILD_TIME:-unknown}
        GOPROXY: ${GOPROXY:-}
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Left empty on purpose: a fixed name is shared by every replica under
      # `--scale`, so the worker derives a per-process consumer instead.
      WORKER_ID: ${WORKER_ID:-}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, or copy .env.example into deployments/compose/.env}@postgres:5432/webmonitoring?sslmode=${POSTGRES_SSLMODE:-disable}
      <<: [*postgres-pool-env, *queue-alert-env]
      # Set REDIS_ADDR to redis://:password@redis:6379 when REDIS_PASSWORD is set.
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      S3_ENDPOINT: http://objectstore:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY, or copy .env.example into deployments/compose/.env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY, or copy .env.example into deployments/compose/.env}
      S3_BUCKET: evidence
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:?set BROWSER_WORKER_TOKEN, or copy .env.example into deployments/compose/.env}
      # Versioned rotation form. When ALERT_SECRET_KEYS is set it takes precedence
      # over the singular variable, so a rotation is a change to this one line.
      ALERT_SECRET_KEYS: ${ALERT_SECRET_KEYS:-}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
      QUEUE_MAX_DELIVERIES: ${QUEUE_MAX_DELIVERIES:-5}
      QUEUE_MIN_IDLE_SECONDS: ${QUEUE_MIN_IDLE_SECONDS:-120}
      QUEUE_RETRY_BASE_MILLISECONDS: ${QUEUE_RETRY_BASE_MILLISECONDS:-500}
      ALERT_QUEUE_MAX_DELIVERIES: ${ALERT_QUEUE_MAX_DELIVERIES:-5}
      ALERT_QUEUE_MIN_IDLE_SECONDS: ${ALERT_QUEUE_MIN_IDLE_SECONDS:-120}
      ALERT_MAX_ATTEMPTS: ${ALERT_MAX_ATTEMPTS:-3}
      ALERT_RETRY_BASE_MILLISECONDS: ${ALERT_RETRY_BASE_MILLISECONDS:-250}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # How long a RUNNING detection claim is honoured. Must exceed one second
      # of the policy timeout: the cap is 90s and a BROWSER check spends it
      # twice, so the production gate rejects anything at or below 270. The
      # default here is well clear of that.
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-600}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Same collector as the API so a job's span joins the API's trace.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
      browser-worker: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    mem_limit: 1g
    cpus: 2
    # read_only is deliberately not set: the worker writes DATA_DIR.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging

  console:

    # PID 1 must reap orphaned children (browser-worker spawns chromium
    # per check); without init the runtime leaves them to accumulate.
    init: true
    # In-flight work drains on SIGTERM (see the worker's drain log);
    # the grace period must exceed the longest check plus the drain log.
    stop_grace_period: 15s
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
      network: ${BUILD_NETWORK:-default}
      args:
        # Off by default: nginx publishes dist as-is, so generating source maps
        # would ship them to anyone who can open the console. Interpolated from
        # this file's environment/.env, the same way GOPROXY is for the Go images.
        CONSOLE_SOURCEMAP: ${CONSOLE_SOURCEMAP:-}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8088:8080"
    mem_limit: 256m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
