services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webmonitoring
      POSTGRES_USER: webmonitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webmonitoring}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../db/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001-initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmonitoring"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-webmonitoring}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-replace-with-a-random-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  browser-worker:
    build:
      context: ../..
      dockerfile: apps/browser-worker/Dockerfile
    environment:
      PORT: "8081"
      WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
      SESSION_SECURE: "false"
      ALLOW_PRIVATE_TARGETS: "false"
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:-webmonitoring}@postgres:5432/webmonitoring?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-webmonitoring}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-random-secret}
      S3_BUCKET: evidence
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      browser-worker: { condition: service_started }
    ports:
      - "8080:8080"

  http-worker:
    build:
      context: ../..
      dockerfile: apps/http-worker/Dockerfile
    environment:
      WORKER_ID: http-worker-1
      ALLOW_PRIVATE_TARGETS: "false"
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:-webmonitoring}@postgres:5432/webmonitoring?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-webmonitoring}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-random-secret}
      S3_BUCKET: evidence
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      browser-worker: { condition: service_started }

  console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    depends_on:
      - api
    ports:
      - "8088:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
