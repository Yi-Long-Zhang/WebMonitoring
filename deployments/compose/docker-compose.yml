services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webmonitoring
      POSTGRES_USER: webmonitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webmonitoring}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webmonitoring"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: apps/migrate/Dockerfile
    command: ["up"]
    environment:
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:-webmonitoring}@postgres:5432/webmonitoring?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-webmonitoring}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-replace-with-a-random-secret}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  browser-worker:
    build:
      context: ../..
      dockerfile: apps/browser-worker/Dockerfile
    environment:
      PORT: "8081"
      WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      DATA_DIR: /data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
      QUEUE_RETRY_BASE_MILLISECONDS: ${QUEUE_RETRY_BASE_MILLISECONDS:-500}
      ALERT_MAX_ATTEMPTS: ${ALERT_MAX_ATTEMPTS:-3}
      ALERT_RETRY_BASE_MILLISECONDS: ${ALERT_RETRY_BASE_MILLISECONDS:-250}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      # Empty endpoint keeps tracing off; set it to an OTLP/HTTP collector to enable.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:-webmonitoring}@postgres:5432/webmonitoring?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-webmonitoring}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-random-secret}
      S3_BUCKET: evidence
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      browser-worker: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "8080:8080"
    restart: unless-stopped

  http-worker:
    build:
      context: ../..
      dockerfile: apps/http-worker/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      WORKER_ID: http-worker-1
      SESSION_SECURE: ${SESSION_SECURE:-false}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      POSTGRES_DSN: postgres://webmonitoring:${POSTGRES_PASSWORD:-webmonitoring}@postgres:5432/webmonitoring?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-webmonitoring}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-replace-with-a-random-secret}
      S3_BUCKET: evidence
      BROWSER_WORKER_URL: http://browser-worker:8081
      BROWSER_WORKER_TOKEN: ${BROWSER_WORKER_TOKEN:-replace-with-a-random-token}
      ALERT_SECRET_KEY: ${ALERT_SECRET_KEY:?set ALERT_SECRET_KEY to a base64-encoded 32-byte key}
      QUEUE_MAX_DELIVERIES: ${QUEUE_MAX_DELIVERIES:-5}
      QUEUE_MIN_IDLE_SECONDS: ${QUEUE_MIN_IDLE_SECONDS:-120}
      QUEUE_RETRY_BASE_MILLISECONDS: ${QUEUE_RETRY_BASE_MILLISECONDS:-500}
      ALERT_QUEUE_MAX_DELIVERIES: ${ALERT_QUEUE_MAX_DELIVERIES:-5}
      ALERT_QUEUE_MIN_IDLE_SECONDS: ${ALERT_QUEUE_MIN_IDLE_SECONDS:-120}
      ALERT_MAX_ATTEMPTS: ${ALERT_MAX_ATTEMPTS:-3}
      ALERT_RETRY_BASE_MILLISECONDS: ${ALERT_RETRY_BASE_MILLISECONDS:-250}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-90}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Same collector as the API so a job's span joins the API's trace.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      browser-worker: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: apps/console/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "8088:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  redis-data:
  minio-data:
