# TLS overlay. Apply it on top of the base file:
#
#   TLS_CERT_DIR=/etc/letsencrypt/live/example.com \
#     docker compose -f deployments/compose/docker-compose.yml \
#                    -f deployments/compose/docker-compose.tls.yml up -d
#
# It adds an nginx edge that terminates TLS and takes over the published ports,
# and turns on the transport settings the production gate requires: the API
# refuses to start with APP_ENV=production unless SESSION_SECURE is true and the
# database DSN is off sslmode=disable.
#
# TLS_CERT_DIR must contain fullchain.pem and privkey.pem. No certificate is
# committed; deployments/.gitignore keeps a stray one out of the repository.
services:
  edge:
    image: nginx:1.29-alpine
    volumes:
      - ../nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR to the directory holding fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api: { condition: service_healthy }
      console: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The API is reachable only through the edge. Publishing 8080 as well would
  # leave a plain-HTTP path to the control plane that bypasses the edge's
  # security headers and its /metrics block, and would let a session cookie
  # marked secure be sent over http.
  api:
    ports: !reset []
    environment:
      SESSION_SECURE: "true"

  # Same for the console on 8088.
  console:
    ports: !reset []
