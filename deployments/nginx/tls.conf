# TLS termination for the control plane. Mounted by the `edge` service in
# docker-compose.tls.yml, which is the only service that publishes a port.
#
# nginx rather than a service-discovery proxy: the project already pulls and
# configures nginx:1.29-alpine in the smoke overlay and both load-test scripts,
# and the console image is itself nginx. A dynamic-config proxy would add an
# image and a configuration surface for no benefit at this size.

server {
    listen 80;
    server_name _;
    # Nothing is served over plain HTTP. A 308 preserves the method and body, so
    # a client that posted to http is not silently downgraded to a GET.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # /metrics is served by the control plane's root mux with no authentication
    # (internal/api/server.go). Publishing it would expose asset counts, job
    # throughput and error rates to anyone who can reach the host. The API keeps
    # serving it on the internal network for a scraper that runs there.
    location = /metrics {
        return 404;
    }

    # /healthz and /readyz are unauthenticated too, but they leak nothing beyond
    # liveness, and an external load balancer needs them.
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }
    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # The SPA calls same-origin /api/v1/*, so the API is routed directly here
    # rather than relayed through the console container's own proxy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is https here; passing it explicitly is what makes the API's
        # SESSION_SECURE=true cookie actually be treated as secure end to end.
        proxy_set_header X-Forwarded-Proto https;
        # GET /api/v1/events/stream is server-sent events. Buffering would hold
        # spans of the stream until the buffer filled, so the console's live
        # refresh would arrive in bursts or not at all. Copied from the console
        # image's own nginx.conf, which learned the same lesson.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://console:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
