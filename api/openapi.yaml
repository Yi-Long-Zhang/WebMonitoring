openapi: 3.1.0
info:
  title: WebMonitoring API
  version: 0.1.0
  description: 网页篡改监测与安全事件处置平台控制面 API。
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200": { description: 进程存活 }
  /readyz:
    get:
      security: []
      operationId: readiness
      responses:
        "200": { description: 依赖就绪 }
        "503": { description: 依赖未就绪 }
  /metrics:
    get:
      security: []
      operationId: metrics
      responses:
        "200": { description: Prometheus 指标, content: { text/plain: { schema: { type: string } } } }
  /auth/session:
    post:
      security: []
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                tenant: { type: string }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "201":
          description: 已登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
    get:
      operationId: getSession
      responses:
        "200":
          description: 当前会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: 已退出 }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: 运营总览
          content:
            application/json:
              schema:
                type: object
                required: [assets, verifiedAssets, openIncidents, criticalIncidents, failedJobs]
                properties:
                  assets: { type: integer }
                  verifiedAssets: { type: integer }
                  openIncidents: { type: integer }
                  criticalIncidents: { type: integer }
                  failedJobs: { type: integer }
  /assets:
    get:
      operationId: listAssets
      parameters:
        - name: siteId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 资产列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetList"
    post:
      operationId: createAsset
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, type]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                type: { $ref: "#/components/schemas/AssetType" }
                ownerId: { type: string, format: uuid }
                siteId: { type: string, format: uuid }
                verificationMethod: { $ref: "#/components/schemas/VerificationMethod" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "400": { $ref: "#/components/responses/Error" }
  /assets/import:
    post:
      operationId: importAssets
      description: 批量导入资产；每行独立校验与写入，失败行不影响成功行。
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assets]
              properties:
                dryRun: { type: boolean }
                siteId: { type: string, format: uuid }
                ownerId: { type: string, format: uuid }
                assets:
                  type: array
                  items:
                    type: object
                    required: [name, url, type]
                    properties:
                      name: { type: string }
                      url: { type: string, format: uri }
                      type: { $ref: "#/components/schemas/AssetType" }
                      ownerId: { type: string, format: uuid }
                      siteId: { type: string, format: uuid }
                      verificationMethod: { $ref: "#/components/schemas/VerificationMethod" }
      responses:
        "200":
          description: 逐行导入结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetImportResult" }
        "400": { $ref: "#/components/responses/Error" }
  /assets/export:
    get:
      operationId: exportAssets
      description: 导出当前租户的全部资产，format=json 或 csv。
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200":
          description: 资产导出
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
            text/csv:
              schema: { type: string }
  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getAsset
      responses:
        "200":
          description: 资产详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAsset
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                ownerId: { type: string, format: uuid }
                siteId: { type: string, format: uuid }
                enabled: { type: boolean }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
  /assets/{id}/verification:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: verifyAsset
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [ISSUE, VERIFY]
      responses:
        "200": { description: 验证令牌或验证结果 }
  /assets/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: suspendAsset
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已暂停
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409": { $ref: "#/components/responses/Error" }
  /assets/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: resumeAsset
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已恢复
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "409": { $ref: "#/components/responses/Error" }
  /policies:
    get:
      operationId: listPolicies
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 策略列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyList" }
  /policies/{assetId}:
    put:
      operationId: updatePolicy
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [httpIntervalSeconds, browserIntervalSeconds, timeoutSeconds, maxResponseBytes, ignoreSelectors, trustedDomains]
              properties:
                httpIntervalSeconds: { type: integer }
                browserIntervalSeconds: { type: integer }
                timeoutSeconds: { type: integer }
                maxResponseBytes: { type: integer, format: int64 }
                ignoreSelectors:
                  type: array
                  items: { type: string }
                trustedDomains:
                  type: array
                  items: { type: string }
                maintenanceWindowStart: { type: string, format: date-time }
                maintenanceWindowEnd: { type: string, format: date-time }
                auth: { $ref: "#/components/schemas/AuthConfigInput" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
  /baselines:
    get:
      operationId: listBaselines
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 基线列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BaselineList" }
  /baselines/{id}:
    get:
      operationId: getBaseline
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 基线详情，含抓取快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Baseline" }
        "404": { $ref: "#/components/responses/Error" }
  /baselines/{id}/approve:
    post:
      operationId: approveBaseline
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已批准
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Baseline" }
  /baselines/{id}/reject:
    post:
      operationId: rejectBaseline
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已拒绝
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Baseline" }
  /baselines/{id}/retire:
    post:
      operationId: retireBaseline
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已废弃
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Baseline" }
  /detection-jobs:
    get:
      operationId: listDetectionJobs
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 检测任务列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectionJobList" }
    post:
      operationId: createDetectionJob
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, mode]
              properties:
                assetId: { type: string, format: uuid }
                mode: { type: string, enum: [HTTP, BROWSER] }
      responses:
        "202":
          description: 已进入队列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectionJob" }
  /detection-jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: cancelDetectionJob
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 已取消
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetectionJob" }
        "409": { $ref: "#/components/responses/Error" }
  /incidents:
    get:
      operationId: listIncidents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 事件列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentList" }
  /incidents/{id}:
    get:
      operationId: getIncident
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: 事件详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
  /incidents/{id}/timeline:
    get:
      operationId: listIncidentTimeline
      description: 事件时间线，按发生时间倒序；同一时刻的多条记录之间顺序不保证
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 事件时间线
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentTimeline" }
        "404": { $ref: "#/components/responses/Error" }
  /incidents/{id}/comments:
    post:
      operationId: addIncidentComment
      description: 为事件追加一条备注。备注作为时间线条目保存，不覆盖既有记录
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 2, maxLength: 2000 }
      responses:
        "201":
          description: 备注已追加
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /incidents/{id}/transition:
    post:
      operationId: transitionIncident
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/IncidentStatus" }
                ownerId: { type: string, format: uuid }
                resolution: { type: string }
      responses:
        "200":
          description: 已流转
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
  /evidence:
    get:
      operationId: listEvidence
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 证据列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceList" }
  /evidence/{id}/download:
    get:
      operationId: downloadEvidence
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200": { description: 证据文件 }
  /evidence/{id}/signed-url:
    post:
      operationId: issueEvidenceSignedUrl
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: 短时签名下载 URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedUrl" }
  /alert-channels:
    get:
      operationId: listAlertChannels
      responses:
        "200":
          description: 告警渠道列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannelList" }
    post:
      operationId: createAlertChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAlertChannel" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
  /alert-channels/{id}:
    put:
      operationId: updateAlertChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertChannelUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertChannel" }
    delete:
      operationId: deleteAlertChannel
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: 已删除
  /alert-deliveries:
    get:
      operationId: listAlertDeliveries
      parameters:
        - name: incidentId
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 告警投递列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertDeliveryList" }
  /reports/summary:
    get:
      operationId: getReportSummary
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          schema: { $ref: "#/components/schemas/Severity" }
      responses:
        "200":
          description: 运营统计汇总
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSummary" }
        "400": { $ref: "#/components/responses/Error" }
  /audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: actorId
          in: query
          description: 按操作者精确匹配。自动写入（保留策略清理）没有 actor，不会被任何 actorId 命中。
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: 按动作精确匹配，不支持前缀。
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: resourceId
          in: query
          schema: { type: string }
        - name: result
          in: query
          schema: { type: string, enum: [SUCCESS, FAILED, PARTIAL] }
        - name: from
          in: query
          description: 闭区间下界。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 闭区间上界。早于 from 会被拒绝。
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: 审计列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
        "400": { $ref: "#/components/responses/Error" }
  /maintenance/retention:
    post:
      operationId: runRetentionMaintenance
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [execute]
              properties:
                execute: { type: boolean }
      responses:
        "200":
          description: 保留期维护结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionMaintenanceResult" }
        "403": { $ref: "#/components/responses/Error" }
  /reports/{incidentId}:
    get:
      operationId: downloadIncidentReport
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: ZIP 证据报告 }
  /events/stream:
    get:
      operationId: streamEvents
      responses:
        "200":
          description: SSE 任务与事件流
          content:
            text/event-stream:
              schema: { type: string }
  /sites:
    get:
      operationId: listSites
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 站点列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteList" }
    post:
      operationId: createSite
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, domain]
              properties:
                name: { type: string }
                domain: { type: string }
                ownerId: { type: string, format: uuid }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /sites/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getSite
      responses:
        "200":
          description: 站点详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSite
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                domain: { type: string }
                ownerId: { type: string, format: uuid }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "403": { $ref: "#/components/responses/Error" }
  /tenants:
    get:
      operationId: listTenants
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 租户列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantList" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createTenant
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, adminUsername, adminPassword]
              properties:
                name: { type: string }
                slug: { type: string }
                adminUsername: { type: string }
                adminPassword: { type: string, format: password }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    get:
      operationId: getTenant
      responses:
        "200":
          description: 租户详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateTenant
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                disabled: { type: boolean }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteTenant
      description: 删除租户；confirm 必须回显 slug，非空租户需显式 cascade。
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
                cascade: { type: boolean }
      responses:
        "200":
          description: 已删除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantDeleteResult" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      operationId: changeOwnPassword
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "204": { description: 已更新 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /users:
    get:
      operationId: listUsers
      responses:
        "200":
          description: 租户用户列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUser
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    patch:
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                role: { $ref: "#/components/schemas/Role" }
                disabled: { type: boolean }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/ResourceID"
    post:
      operationId: resetUserPassword
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "204": { description: 已重置 }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: webmonitoring_session
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code: { type: string }
        message: { type: string }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
    Role:
      type: string
      enum: [ADMIN, OPERATOR, AUDITOR, SUPER_ADMIN]
    User:
      type: object
      required: [id, tenantId, username, role, disabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    UserList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        nextCursor: { type: string }
    Tenant:
      type: object
      required: [id, slug, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        disabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    TenantDeleteResult:
      type: object
      required: [tenantId, deletedResources, orphanedEvidenceObjects]
      properties:
        tenantId: { type: string, format: uuid }
        deletedResources:
          type: object
          additionalProperties: { type: integer }
        orphanedEvidenceObjects: { type: integer }
    AssetImportResult:
      type: object
      required: [dryRun, rows, created, results]
      properties:
        dryRun: { type: boolean }
        rows: { type: integer }
        created: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [index, status]
            properties:
              index: { type: integer }
              assetId: { type: string, format: uuid }
              name: { type: string }
              url: { type: string }
              status: { type: string, enum: [CREATED, VALIDATED, REJECTED] }
              code: { type: string }
              message: { type: string }
    TenantList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Tenant" }
        nextCursor: { type: string }
    Session:
      type: object
      required: [user, tenant, csrfToken, expiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        tenant: { $ref: "#/components/schemas/Tenant" }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    AssetType:
      type: string
      enum: [OFFICIAL, BUSINESS, LOGIN, OTHER]
    VerificationStatus:
      type: string
      enum: [PENDING, VERIFIED, REJECTED, SUSPENDED]
    VerificationMethod:
      type: string
      enum: [FILE, DNS, META]
    Asset:
      type: object
      required: [id, tenantId, name, url, type, enabled, verificationStatus, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri }
        type: { $ref: "#/components/schemas/AssetType" }
        ownerId: { type: string, format: uuid }
        enabled: { type: boolean }
        verificationStatus: { $ref: "#/components/schemas/VerificationStatus" }
        verificationMethod: { $ref: "#/components/schemas/VerificationMethod" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssetList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }
        nextCursor: { type: string }
    Site:
      type: object
      required: [id, tenantId, name, domain, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SiteList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Site" }
        nextCursor: { type: string }
    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
    IncidentStatus:
      type: string
      enum: [OPEN, ACKNOWLEDGED, INVESTIGATING, RESOLVED, CLOSED, FALSE_POSITIVE]
    Signal:
      type: object
      required: [id, kind, severity, summary, evidenceIds, ruleVersion, fingerprint]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        summary: { type: string }
        before: {}
        after: {}
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        ruleVersion: { type: string }
        fingerprint: { type: string }
    Incident:
      type: object
      required: [id, assetId, severity, status, title, occurrenceCount, firstSeenAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        baselineId: { type: string, format: uuid }
        baselineVersion: { type: integer }
        fingerprint: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        title: { type: string }
        occurrenceCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        signals:
          type: array
          items: { $ref: "#/components/schemas/Signal" }
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        resolution: { type: string }
        acknowledgedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        # These three are always serialized by the handler but were missing from
        # the contract, so the generated console types could not see them.
        tenantId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    IncidentList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Incident" }
        nextCursor: { type: string }
    IncidentEventType:
      type: string
      enum: [CREATED, RECURRED, STATUS_CHANGED, OWNER_ASSIGNED, COMMENTED]
    IncidentEvent:
      type: object
      description: |
        事件时间线的一条记录。signals 是**该轮检测**看到的信号集，不是当前生效的
        那一份——事件行上的 signals 每轮都会被覆盖，所以复现明细只存在于这里。
      required: [id, incidentId, type, createdAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/IncidentEventType" }
        actorId:
          type: string
          format: uuid
          description: 为空表示由检测 Worker 自动写入，没有人类操作者
        fromStatus: { $ref: "#/components/schemas/IncidentStatus" }
        toStatus: { $ref: "#/components/schemas/IncidentStatus" }
        severity: { $ref: "#/components/schemas/Severity" }
        title: { type: string }
        signals:
          type: array
          items: { $ref: "#/components/schemas/Signal" }
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        jobId:
          type: string
          format: uuid
          description: 产生该轮复现的检测任务，可追溯到具体一次运行
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    IncidentTimeline:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IncidentEvent" }
        nextCursor: { type: string }
    BaselineStatus:
      type: string
      enum: [CANDIDATE, APPROVED, REJECTED, RETIRED]
    Baseline:
      type: object
      required: [id, assetId, version, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        version: { type: integer }
        status: { $ref: "#/components/schemas/BaselineStatus" }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        # Serialized by the handler since the beginning, but missing from the
        # contract, so the generated console types could not see them. Same
        # omission the Incident schema records above.
        tenantId: { type: string, format: uuid }
        evidenceIds:
          type: array
          items: { type: string, format: uuid }
        createdBy: { type: string, format: uuid }
        approvedBy: { type: string, format: uuid }
        # Deliberately not required: a candidate whose capture failed carries a
        # zero snapshot, and declaring it required would make the generated type
        # claim a shape the server does not guarantee.
        snapshot: { $ref: "#/components/schemas/Snapshot" }
    Snapshot:
      type: object
      required: [url, finalUrl, statusCode, title, contentHash, textHash, durationMillis, capturedAt]
      properties:
        url: { type: string }
        finalUrl: { type: string }
        statusCode: { type: integer }
        title: { type: string }
        contentHash: { type: string }
        textHash: { type: string }
        screenshotHash: { type: string }
        scripts:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              inlineHash: { type: string }
        links:
          type: array
          items: { type: string }
        iframes:
          type: array
          items: { type: string }
        forms:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              method: { type: string }
        redirectChain:
          type: array
          items: { type: string }
        resolvedIps:
          type: array
          items: { type: string }
        tlsFingerprint: { type: string }
        responseHeaders:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        resourceRequests:
          type: array
          items: { type: string }
        blockedRequests:
          type: array
          items: { type: string }
        popups:
          type: array
          items: { type: string }
        dialogs:
          type: array
          items: { type: string }
        downloads:
          type: array
          items: { type: string }
        durationMillis: { type: integer, format: int64 }
        capturedAt: { type: string, format: date-time }
    BaselineList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Baseline" }
        nextCursor: { type: string }
    Policy:
      type: object
      required: [id, assetId, version, httpIntervalSeconds, browserIntervalSeconds, timeoutSeconds, maxResponseBytes, ignoreSelectors, trustedDomains]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        version: { type: integer }
        httpIntervalSeconds: { type: integer }
        browserIntervalSeconds: { type: integer }
        timeoutSeconds: { type: integer }
        maxResponseBytes: { type: integer, format: int64 }
        ignoreSelectors:
          type: array
          items: { type: string }
        trustedDomains:
          type: array
          items: { type: string }
        maintenanceWindowStart: { type: string, format: date-time }
        maintenanceWindowEnd: { type: string, format: date-time }
        auth: { $ref: "#/components/schemas/AuthConfig" }
    PolicyList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Policy" }
        nextCursor: { type: string }
    AuthConfig:
      type: object
      required: [loginUrl, usernameField, passwordField]
      properties:
        loginUrl: { type: string, format: uri }
        usernameField: { type: string }
        passwordField: { type: string }
        extraFields:
          type: object
          additionalProperties: { type: string }
        submitSelector: { type: string }
        credentialsSet: { type: boolean }
    AuthConfigInput:
      type: object
      required: [loginUrl, usernameField, passwordField]
      properties:
        loginUrl: { type: string, format: uri }
        usernameField: { type: string }
        passwordField: { type: string }
        extraFields:
          type: object
          additionalProperties: { type: string }
        submitSelector: { type: string }
        username: { type: string }
        password: { type: string, format: password }
    DetectionJob:
      type: object
      required: [id, assetId, mode, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        mode: { type: string, enum: [HTTP, BROWSER] }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        errorMessage: { type: string }
        retryCount: { type: integer }
        maxAttempts: { type: integer }
    DetectionJobList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DetectionJob" }
        nextCursor: { type: string }
    Evidence:
      type: object
      required: [id, assetId, jobId, kind, mediaType, size, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        kind: { type: string }
        mediaType: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }
        retainUntil: { type: string, format: date-time }
    EvidenceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Evidence" }
        nextCursor: { type: string }
    SignedUrl:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    AlertChannelType:
      type: string
      enum: [WEBHOOK, WECHAT_WORK, DINGTALK, EMAIL]
    AlertChannel:
      type: object
      required: [id, name, type, url, enabled, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        url: { type: string }
        recipients: { type: string }
        enabled: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateAlertChannel:
      type: object
      required: [name, type, enabled]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        url: { type: string, format: uri }
        recipients: { type: string }
        secret: { type: string, format: password }
        enabled: { type: boolean }
    # Same shape as CreateAlertChannel except for `secret`, where an empty
    # string means "keep the stored credential". Responses never carry the
    # plaintext, so a client cannot echo the stored value back; treating empty
    # as an erase would wipe the credential on any edit that only renamed the
    # channel.
    AlertChannelUpdate:
      type: object
      required: [name, type, enabled]
      properties:
        name: { type: string }
        type: { $ref: "#/components/schemas/AlertChannelType" }
        url: { type: string, format: uri }
        recipients: { type: string }
        secret: { type: string, format: password }
        enabled: { type: boolean }
    AlertDelivery:
      type: object
      required: [id, incidentId, channelId, dedupKey, status, attempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        # One incident notifies more than once -- it is opened, then acknowledged,
        # then resolved -- so the key names the reason as well as the incident and
        # channel: "<incidentId>:<channelId>:<reason>". Two deliveries that differ
        # only in their reason are two messages, not a duplicate.
        dedupKey: { type: string }
        status: { type: string, enum: [PENDING, DELIVERED, FAILED] }
        attempts: { type: integer }
        lastError: { type: string }
        nextAttemptAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertDeliveryList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertDelivery" }
        nextCursor: { type: string }
    ReportSummary:
      type: object
      required: [assets, verifiedAssets, detectionJobs, successfulJobs, failedJobs, incidents, alertDeliveries, severityCounts, mttdSeconds, mttaSeconds, mttrSeconds]
      properties:
        assets: { type: integer }
        verifiedAssets: { type: integer }
        detectionJobs: { type: integer }
        successfulJobs: { type: integer }
        failedJobs: { type: integer }
        incidents: { type: integer }
        alertDeliveries: { type: integer }
        severityCounts: { type: object, additionalProperties: { type: integer } }
        mttdSeconds: { type: number, format: double }
        mttaSeconds: { type: number, format: double }
        mttrSeconds: { type: number, format: double }
    AlertChannelList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AlertChannel" }
        nextCursor: { type: string }
    AuditEvent:
      type: object
      required: [id, actorId, action, resourceType, resourceId, result, traceId, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string }
        result: { type: string }
        traceId: { type: string }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AuditEventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor: { type: string }
    RetentionMaintenanceResult:
      type: object
      required: [dryRun, expiredEvidence, deletedEvidence, protectedEvidence, failedEvidence, deletedAuditEvents, failureReasons]
      properties:
        dryRun: { type: boolean }
        expiredEvidence: { type: integer }
        deletedEvidence: { type: integer }
        protectedEvidence: { type: integer }
        failedEvidence: { type: integer }
        deletedAuditEvents: { type: integer }
        failureReasons:
          type: array
          items: { type: string }
