server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Declared so the proxy below can re-resolve the api
  # service instead of freezing its address at startup: without a resolver,
  # nginx resolves proxy_pass's hostname once while loading this config and
  # keeps dialing that IP forever. The api container is restarted on a new
  # address (the compose smoke does it on purpose, a redeploy does it by
  # accident) and the frozen address then answers every API call with 502
  # "connect() failed (111: Connection refused)" until the console is restarted
  # too -- a failure that looks like the API being down when it is up.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location /api/ {
    # The upstream is held in a variable so the resolver above is consulted per
    # request rather than once at load. A literal proxy_pass host is resolved
    # eagerly and would defeat the resolver entirely.
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
